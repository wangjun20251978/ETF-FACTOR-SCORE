name: 每日更新因子打分
on:
  schedule:
    - cron: '35 7 * * *'   # UTC 07:35 = 北京时间 15:35 收盘后, 每天
    - cron: '10 23 * * *'  # 早场 UTC 23:10 = 北京7:10名义, 实际约8:50-9:40 早场
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行生成脚本
        run: python etf_factor_score.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "auto: update factor score $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push
